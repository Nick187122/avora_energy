services:
  - type: web
    name: avora-web
    runtime: php
    plan: free
    region: oregon
    buildCommand: |
      # Install Node 20
      curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      apt-get install -y nodejs
      # Build
      composer install --no-dev --optimize-autoloader
      npm ci --prefer-offline --no-audit
      npm run build
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
    startCommand: |
      # Wait for DB
      until php -r "
        \$host = getenv('DB_HOST');
        \$port = getenv('DB_PORT') ?: 5432;
        \$timeout = 60;
        \$start = time();
        while (time() - \$start < \$timeout) {
          if (@fsockopen(\$host, \$port, \$errno, \$errstr, 2)) { exit(0); }
          sleep(1);
        }
        exit(1);
      "; do echo 'Waiting for DB...'; sleep 2; done
      php artisan migrate --force
      php artisan storage:link
      php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: DB_CONNECTION
        value: pgsql
      - key: NODE_VERSION
        value: "20"
    healthCheckPath: /
    autoDeploy: true
    # Increase memory for build
    envVars:
      - key: COMPOSER_MEMORY_LIMIT
        value: "-1"

databases:
  - name: avora-db
    plan: free
    region: oregon
    databaseName: avora
    user: render
    postgresMajorVersion: "16"