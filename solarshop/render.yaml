services:
  - type: web
    name: avora-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: solarshop
    plan: free
    region: oregon
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
    healthCheckPath: /
    autoDeploy: true

databases:
  - name: avora-db
    plan: free
    region: oregon
    databaseName: avora
    user: render
    postgresMajorVersion: "16"